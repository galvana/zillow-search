name: Zillow Monitor

on:
  # Run every hour
  schedule:
    - cron: "0 * * * *"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Persist seen listings between runs using a cache
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore seen listings cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_listings.json
          key: seen-listings-${{ github.ref_name }}
          restore-keys: |
            seen-listings-

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZILLOW_EMAIL_USER: ${{ secrets.ZILLOW_EMAIL_USER }}
          ZILLOW_EMAIL_PASSWORD: ${{ secrets.ZILLOW_EMAIL_PASSWORD }}
          ZILLOW_EMAIL_FROM: ${{ secrets.ZILLOW_EMAIL_FROM }}
        run: python monitor.py

      - name: Save seen listings cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/seen_listings.json
          key: seen-listings-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: data/results/
          retention-days: 30
          if-no-files-found: ignore
